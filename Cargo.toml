[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.1"
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/IronAdamant/Mem-Harness"
description = "One MCP server and one set of Claude Code hooks in front of nine std-only Rust agent tools"

[profile.release]
codegen-units = 1
lto = true
